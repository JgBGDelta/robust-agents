# Experimento mini: validación pre-full con más de 1 instancia por agente.
#
# Propósito: detectar problemas de escala (paralelismo, Docker, costes) antes
# de lanzar el experimento completo. Usa el mismo formato que experiment.full.yaml
# por lo que si funciona aquí, el full debería funcionar sin cambios.
#
# Matriz de runs:
#   default, robust_strict, robust_balanced, robust_permissive →  4 × 5 = 20 runs
#   robust_no_intervention, robust_v2                          →  2 × 2 =  4 runs
#   Total                                                               → 24 runs
#
# Uso:
#   python -m benchmark.run --config configs/experiment.mini.yaml
#
# Si funciona → lanzar experiment.full.yaml

experiment_id_explicit: mini-lite-5inst-6agents

# ── Dataset ────────────────────────────────────────────────────────────────────
dataset:
  name: SWE-bench/SWE-bench_Lite
  subset: lite
  split: test
  slice_strategy: stratified_by_repo
  slice_size: 5
  slice_seed: 42

# ── Benchmark ──────────────────────────────────────────────────────────────────
benchmark:
  runs_root: runs
  workers: 2
  inter_run_delay_seconds: 0      # delay dinamico: arranca en 0 y sube hasta 60s si hay errores 429
  functional_backend: sb_cli
  evaluation_skip: true           # sin evaluación sb-cli en el mini
  mini_agent_config: configs/mini/swebench_gemini_json.yaml

# ── Parámetros compartidos (YAML anchors) ─────────────────────────────────────
x-gemini-agent: &gemini-agent
  model_id: gemini/gemini-2.5-flash
  environment_class: minisweagent.environments.docker.DockerEnvironment
  cost_limit: 2.0
  step_limit: 250

x-robust-base: &robust-base
  <<: *gemini-agent
  agent_class: agent.robust_agent.RobustAgent
  mini_agent_config: configs/mini/swebench_gemini_json_robust.yaml

# ── Agentes ───────────────────────────────────────────────────────────────────
agents:

  # ════════════════════════════════════════════════════════════════════════════
  # GRUPO PRINCIPAL  — 5 instancias c/u
  # ════════════════════════════════════════════════════════════════════════════

  - <<: *gemini-agent
    agent_id: default
    agent_class: minisweagent.agents.default.DefaultAgent

  - <<: *robust-base
    agent_id: robust_strict

  - <<: *robust-base
    agent_id: robust_balanced

  - <<: *robust-base
    agent_id: robust_permissive

  # ════════════════════════════════════════════════════════════════════════════
  # ABLACIONES  — 2 instancias c/u (sub-slice del pool de 5, misma seed)
  # ════════════════════════════════════════════════════════════════════════════

  # Ablación 1: controlador inerte (siempre PROCEED)
  - <<: *robust-base
    agent_id: robust_no_intervention
    dataset_slice_size: 2
    config_overrides:
      profile: balanced
      controller:
        policy_matrix:
          low:    {low: PROCEED, medium: PROCEED, high: PROCEED}
          medium: {low: PROCEED, medium: PROCEED, high: PROCEED}
          high:   {low: PROCEED, medium: PROCEED, high: PROCEED}
        high_high_per_profile:
          strict: PROCEED
          balanced: PROCEED
          permissive: PROCEED
        stability_window: 9999

  # Ablación 2: umbrales conservadores (high=0.80, low=0.40)
  - <<: *robust-base
    agent_id: robust_v2
    dataset_slice_size: 2
    config_overrides:
      profile: balanced
      uncertainty:
        high_threshold: 0.80
        low_threshold: 0.40
      structural_metrics:
        high_threshold: 0.80
        low_threshold: 0.40
